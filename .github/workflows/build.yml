name: Build Katsumi Sherpa Android Plugin

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Build debug AAR
        run: gradle :plugin:assembleDebug --stacktrace

      - name: Verify AAR
        run: |
          test -f plugin/build/outputs/aar/KatsumiSherpa-debug.aar
          echo "KATSUMI SHERPA | AAR BUILD OK"

      - name: Upload debug AAR
        uses: actions/upload-artifact@v4
        with:
          name: KatsumiSherpa-debug
          path: plugin/build/outputs/aar/KatsumiSherpa-debug.aar
