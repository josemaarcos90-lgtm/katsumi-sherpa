name: Build Katsumi Sherpa Android Plugin

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Fetch sherpa-onnx Android 1.13.8
        run: |
          curl -L --fail --retry 3 -o /tmp/sherpa-android.tar.bz2 https://github.com/k2-fsa/sherpa-onnx/releases/download/v1.13.8/sherpa-onnx-v1.13.8-android.tar.bz2
          mkdir -p /tmp/sherpa
          tar -xjf /tmp/sherpa-android.tar.bz2 -C /tmp/sherpa

      - name: Package ARM64 native libraries
        run: |
          mkdir -p plugin/src/main/jniLibs/arm64-v8a
          cp /tmp/sherpa/jniLibs/arm64-v8a/libonnxruntime.so plugin/src/main/jniLibs/arm64-v8a/
          cp /tmp/sherpa/jniLibs/arm64-v8a/libsherpa-onnx-c-api.so plugin/src/main/jniLibs/arm64-v8a/
          cp /tmp/sherpa/jniLibs/arm64-v8a/libsherpa-onnx-cxx-api.so plugin/src/main/jniLibs/arm64-v8a/
          cp /tmp/sherpa/jniLibs/arm64-v8a/libsherpa-onnx-jni.so plugin/src/main/jniLibs/arm64-v8a/
          ls -lh plugin/src/main/jniLibs/arm64-v8a

      - name: Build debug and release AARs
        run: |
          gradle :plugin:assembleDebug :plugin:assembleRelease --stacktrace

      - name: Verify debug and release AARs include ARM64 native libraries
        run: |
          set -e
          for variant in debug release; do
            AAR="plugin/build/outputs/aar/KatsumiSherpa-${variant}.aar"
            test -f "$AAR"
            unzip -l "$AAR" | tee "/tmp/aar-${variant}-files.txt"
            grep -q 'jni/arm64-v8a/libonnxruntime.so' "/tmp/aar-${variant}-files.txt"
            grep -q 'jni/arm64-v8a/libsherpa-onnx-c-api.so' "/tmp/aar-${variant}-files.txt"
            grep -q 'jni/arm64-v8a/libsherpa-onnx-cxx-api.so' "/tmp/aar-${variant}-files.txt"
            grep -q 'jni/arm64-v8a/libsherpa-onnx-jni.so' "/tmp/aar-${variant}-files.txt"
            echo "KATSUMI SHERPA | ${variant} AAR + ARM64 NATIVE LIBS OK"
          done

      - name: Upload debug AAR
        uses: actions/upload-artifact@v4
        with:
          name: KatsumiSherpa-debug
          path: plugin/build/outputs/aar/KatsumiSherpa-debug.aar
          if-no-files-found: error

      - name: Upload release AAR
        uses: actions/upload-artifact@v4
        with:
          name: KatsumiSherpa-release
          path: plugin/build/outputs/aar/KatsumiSherpa-release.aar
          if-no-files-found: error
